name: Contribution Proposal
description: Propose a change or feature before submitting a PR
labels: ["enhancement", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** Read [CONTRIBUTING.md](../../CONTRIBUTING.md).

        Keep this short. If it doesn't fit on one screen, it's too long. Write in your own voice.

  - type: textarea
    id: what
    attributes:
      label: What do you want to change?
      description: Be specific and concise.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: The problem this solves or the capability it adds.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Agent loop / orchestration
        - AI providers / streaming
        - TUI / interaction
        - Tools / skills / extensions
        - Safety / permissions / sandboxing
        - MCP
        - Browser / Web Development
        - Integrations / bridges / computer use
        - Tasks / automation
        - Sessions / memory / projects
        - SDK / server / protocols
        - Documentation
        - Build / install / release
        - Not sure
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Describe the smallest implementation you think would solve the problem. Leave blank if you want help scoping it.
  - type: textarea
    id: verification
    attributes:
      label: How should we verify it?
      description: Tests, commands, or observable behavior that would prove the change works.
