<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Architecture diagram template</title>
  <desc>Left-to-right architecture: client, gateway, auth service, worker, and database, with labelled edges and a legend.</desc>

  <!-- Edge labels are drawn over the arrows; draw edges first -->
  <!-- Client -> Gateway -->
  <line x1="90" y1="120" x2="230" y2="120" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="110" font-size="13" fill="#6b7280" text-anchor="middle">HTTPS</text>
  <!-- Gateway -> Auth -->
  <line x1="330" y1="120" x2="470" y2="120" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="110" font-size="13" fill="#6b7280" text-anchor="middle">token</text>
  <!-- Gateway -> Worker -->
  <line x1="330" y1="150" x2="470" y2="200" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="195" font-size="13" fill="#6b7280" text-anchor="middle">queue</text>
  <!-- Auth -> DB -->
  <line x1="570" y1="120" x2="710" y2="120" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="110" font-size="13" fill="#6b7280" text-anchor="middle">SQL</text>
  <!-- Worker -> DB -->
  <line x1="570" y1="200" x2="710" y2="140" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- Nodes -->
  <g>
    <rect x="10" y="90" width="80" height="60" rx="8" fill="#2f6fed"/>
    <text x="50" y="124" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Client</text>
  </g>
  <g>
    <rect x="230" y="90" width="100" height="60" rx="8" fill="#2f6fed"/>
    <text x="280" y="124" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">API Gateway</text>
  </g>
  <g>
    <rect x="470" y="90" width="100" height="60" rx="8" fill="#b26a00"/>
    <text x="520" y="124" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Auth</text>
  </g>
  <g>
    <rect x="470" y="180" width="100" height="60" rx="8" fill="#b26a00"/>
    <text x="520" y="214" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Worker</text>
  </g>
  <g>
    <rect x="710" y="90" width="120" height="60" rx="8" fill="#188a4e"/>
    <text x="770" y="124" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Postgres</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20 300)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2f6fed"/>
    <text x="20" y="12" font-size="13" fill="#6b7280">internal / primary</text>
    <rect x="150" y="0" width="14" height="14" rx="3" fill="#b26a00"/>
    <text x="170" y="12" font-size="13" fill="#6b7280">external / third-party</text>
    <rect x="330" y="0" width="14" height="14" rx="3" fill="#188a4e"/>
    <text x="350" y="12" font-size="13" fill="#6b7280">data store</text>
  </g>
</svg>
